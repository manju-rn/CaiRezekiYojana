# The Argo Workflows Helm release sets workflow.serviceAccount.create=false but
# rbac.create=true, so a Role + RoleBinding for "argo-workflow" already exist in
# the "invest" namespace (controller.workflowNamespaces: [invest]) - only the
# ServiceAccount object itself may be missing. This creates it. If it already
# exists (nestivesh's build uses it too), applying this again changes nothing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflow
  namespace: invest
