# The build workflow's credentials. Both ship BLANK - fill them in separately,
# and never commit a filled-in copy. Prefer creating them imperatively with
# kubectl (commands below), so a token never touches disk.
#
# Both live in the `invest` namespace, which is the one the Argo Workflows
# controller watches.

# ---------------------------------------------------------------------------
# 1. GitHub: where the clone step pulls the source from.
#
#    Needed only while the repository is private; leave both values empty for a
#    public repo and the clone step falls back to an unauthenticated clone.
#
#    username: your GitHub username
#    token:    a personal access token. A fine-grained one scoped to this one
#              repository with Contents: Read-only is enough (GitHub ->
#              Settings -> Developer settings -> Personal access tokens).
#
#   kubectl -n invest create secret generic cairezeki-git-creds \
#     --from-literal=username='<github-username>' \
#     --from-literal=token='<github-access-token>'
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: cairezeki-git-creds
  namespace: invest
type: Opaque
stringData:
  username: ""
  token: ""

---
# ---------------------------------------------------------------------------
# 2. Docker Hub: where the finished image is pushed (docker.io/<user>/cairezekiyojana).
#
#    password: a Docker Hub access token with Read & Write permission
#    (Account settings -> Personal access tokens), not the account password.
#
#   kubectl -n invest create secret docker-registry cairezeki-dockerhub-creds \
#     --docker-server=https://index.docker.io/v1/ \
#     --docker-username='<dockerhub-username>' \
#     --docker-password='<dockerhub-access-token>'
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: cairezeki-dockerhub-creds
  namespace: invest
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"https://index.docker.io/v1/":{"username":"","password":""}}}
