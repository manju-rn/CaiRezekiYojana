[package]
name = "cairezeki"
version = "0.1.0"
edition = "2021"
description = "CaiRezekiYojana - a single-owner allocation and retirement planner (RezekiYojana and CaiYatra), SGD by default"
license = "MIT"

[dependencies]
# --- web ---
axum = { version = "0.7", features = ["multipart", "macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "compression-gzip"] }
tokio = { version = "1", features = ["full"] }

# --- persistence (Postgres on Supabase; SQLite for a local run - same code path) ---
sea-orm = { version = "1.1", features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
] }
sea-orm-migration = { version = "1.1", features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "with-chrono",
] }

# --- serialisation ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# --- outbound providers (quotes, NAV, FX) ---
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }

# --- spreadsheet / csv import ---
calamine = "0.26"
csv = "1.3"

# --- upload audit: a fingerprint of every kept file ---
sha2 = "0.10"

# --- the built-in owner account: password hashing, tokens ---
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"

# --- OpenAPI description and the Swagger page, built from the handlers ---
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.1"
utoipa-swagger-ui = { version = "8", features = ["axum", "vendored"] }

# --- plumbing ---
async-trait = "0.1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dev-dependencies]
# Driving the router in-process, in tests/api_flow.rs.
tower = { version = "0.4", features = ["util"] }
