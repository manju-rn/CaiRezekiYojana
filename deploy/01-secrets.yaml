# The app's secrets: the Supabase database connection. Nothing else is secret -
# there is no sign-in, no API token and no mail.
#
# This file ships BLANK. Fill it in and apply it, or - better, so the value never
# touches disk - create the Secret imperatively:
#
#   kubectl -n invest create secret generic cairezeki-secrets \
#     --from-literal=CAIREZEKI_DATABASE_URL='postgresql://postgres.<ref>:<password>@<host>:5432/postgres?sslmode=require'
#
# Never commit a filled-in copy.
#
# ---------------------------------------------------------------------------
# Where the value comes from (Supabase dashboard)
# ---------------------------------------------------------------------------
#   Project -> Connect (or Project Settings -> Database) -> Connection string
#
#   * "Session pooler" (port 5432) - recommended: works from IPv4-only networks
#     and keeps prepared statements, which the app uses.
#   * "Direct connection" (port 5432, db.<ref>.supabase.co) - fine if the
#     cluster has IPv6; otherwise it will not connect.
#   * "Transaction pooler" (port 6543) - works only with the statement cache
#     off: append  &statement-cache-capacity=0
#
#   Replace [YOUR-PASSWORD] with the database password (Project Settings ->
#   Database -> Reset database password, if you do not have it). Keep
#   ?sslmode=require on the end. A password with special characters
#   (@ : / ? # %) has to be percent-encoded in the URL.
#
#   The app runs its own migrations on start, creating its tables in the
#   `public` schema and switching row-level security on for each, so the
#   project's public (anon) API key cannot read them. It needs the `postgres`
#   user (or any role that can create tables); it does not use the project URL,
#   the anon key or the service-role key - leave those out.
apiVersion: v1
kind: Secret
metadata:
  name: cairezeki-secrets
  namespace: invest
type: Opaque
stringData:
  # postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
  CAIREZEKI_DATABASE_URL: ""
