apiVersion: v1
kind: ConfigMap
metadata:
  name: cairezeki-config
  namespace: invest
data:
  CAIREZEKI_BIND: "0.0.0.0:8080"
  CAIREZEKI_STATIC_DIR: "/app/static"
  # The tables are created (and kept up to date) by the app itself on start.
  CAIREZEKI_AUTO_MIGRATE: "true"
  CAIREZEKI_LOG: "cairezeki=info,tower_http=warn,info"
  # Stdout only, and no kept copies of uploaded files: the pod keeps no state.
  CAIREZEKI_LOG_DIR: "none"
  CAIREZEKI_UPLOADS_DIR: "none"
