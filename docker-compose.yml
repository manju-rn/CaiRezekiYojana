# Run CaiRezekiYojana locally.
#
#   docker compose up -d
#
# With CAIREZEKI_DATABASE_URL set in .env it uses that - the Supabase
# connection string. Without it, it falls back to SQLite on a local volume, so
# the app can be tried with no database at all. The application code is
# identical either way.

services:
  cairezeki:
    build:
      context: .
      dockerfile: Dockerfile
    image: cairezeki:latest
    container_name: cairezeki
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - cairezeki-data:/data
    environment:
      CAIREZEKI_DATABASE_URL: '${CAIREZEKI_DATABASE_URL:-sqlite:///data/cairezeki.db?mode=rwc}'
      CAIREZEKI_BIND: '0.0.0.0:8080'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/api/v1/health']
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  cairezeki-data:
